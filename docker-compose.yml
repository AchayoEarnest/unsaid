services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: unsaid }
    volumes: ["pg:/var/lib/postgresql/data", "./db:/docker-entrypoint-initdb.d:ro"]
    ports: ["5432:5432"]
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [db]
  ws:
    build: .
    command: npx tsx server/ws.ts
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [db]
volumes: { pg: {} }
