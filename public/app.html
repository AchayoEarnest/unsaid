<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><title>Unsaid – someone out there understands</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1f;--bg2:#151833;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef0ff;--mut:#a7abcc;--vio:#9b8cff;--pink:#ff8fb1;--teal:#5fe0cf;--blue:#6aa8ff;--on:#0d0f1f;--note:#ffe9a8;--notetx:#2b2414;--paper:#f3ecff;--papertx:#241f3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f7f4fb;--bg2:#ebe6f7;--card:rgba(255,255,255,.7);--line:rgba(30,20,80,.14);--tx:#1b1840;--mut:#575a82;--vio:#5a46d6;--pink:#c2386a;--teal:#0c7d70;--blue:#2860c9;--on:#fff}}
:root[data-theme="light"]{--bg:#f7f4fb;--bg2:#ebe6f7;--card:rgba(255,255,255,.7);--line:rgba(30,20,80,.14);--tx:#1b1840;--mut:#575a82;--vio:#5a46d6;--pink:#c2386a;--teal:#0c7d70;--blue:#2860c9;--on:#fff}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:70px}
body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 80% -10%,var(--bg2),transparent),var(--bg);color:var(--tx);font:16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a{color:var(--vio)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:-1}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em;background:none;border:0;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50% 50% 50% 4px;background:linear-gradient(135deg,var(--vio),var(--pink));display:inline-block}
nav.d{display:flex;gap:2px;margin-left:10px;flex:1}
nav.d button,.tab{background:none;border:0;padding:8px 12px;border-radius:99px;color:var(--mut)}
nav.d button[aria-current],.tab[aria-current]{background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);position:relative}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--pink)}
nav.m{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around}
nav.m button{background:none;border:0;min-width:56px;min-height:48px;font-size:12px;color:var(--mut);display:grid;place-items:center}
nav.m button[aria-current]{color:var(--vio)}
nav.m .sh{background:linear-gradient(135deg,var(--vio),var(--pink));color:var(--on);border-radius:50%;width:52px;height:52px;margin-top:-18px;font-size:26px}
main{max-width:1180px;margin:0 auto;padding:22px 18px 90px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.03em;margin:.2em 0 .3em;max-width:15ch}
h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin:1.6em 0 .5em}h3{margin:.2em 0}
.lead{color:var(--mut);max-width:56ch;font-size:18px}
.btn{border:0;border-radius:99px;padding:13px 22px;min-height:46px;font-weight:700;background:linear-gradient(135deg,var(--vio),var(--pink));color:var(--on)}
.btn.g{background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(8px)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;min-height:38px}
.chip[aria-pressed=true]{background:var(--vio);color:var(--on);border-color:var(--vio)}
.hero{display:grid;gap:28px;grid-template-columns:1.1fr 1fr;align-items:center;min-height:62vh}
/* wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 20px;padding:18px 4px;align-items:start}
.st{position:relative;text-align:left;border:0;padding:20px 18px 14px;transform:rotate(var(--r));transition:transform .25s,box-shadow .25s;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:bob var(--d) ease-in-out infinite alternate;min-height:var(--h)}
.st:hover,.st:focus-visible{transform:rotate(0) scale(1.04) translateY(-3px);z-index:3;animation-play-state:paused}
@keyframes bob{to{translate:0 -6px}}
.st q{display:block;quotes:none;font-size:19px;line-height:1.3;margin:8px 0 14px}
.st .m{font-size:13px;font-weight:700}.st .f{font-size:13px;opacity:.8;display:flex;justify-content:space-between}
.s-note{background:var(--note);color:var(--notetx);border-radius:3px 3px 18px 3px}.s-note q{font-family:Caveat,cursive;font-size:26px}
.s-pol{background:#fdfbff;color:#25203a;padding-bottom:30px;border-radius:3px;border-top:16px solid #fdfbff;outline:10px solid #fdfbff;outline-offset:-10px}
.s-pol::before{content:"";display:block;height:34px;margin:-6px -2px 6px;background:linear-gradient(120deg,#7e6bff,#ff8fb1);border-radius:2px}
.s-round{background:linear-gradient(160deg,#243a63,#3b2a63);color:#fff;border-radius:28px}
.s-torn{background:var(--paper);color:var(--papertx);clip-path:polygon(0 3%,8% 0,18% 3%,30% 0,44% 3%,58% 0,72% 3%,86% 0,100% 3%,100% 97%,90% 100%,76% 97%,60% 100%,44% 97%,28% 100%,12% 97%,0 100%)}
.s-bub{background:linear-gradient(150deg,var(--teal),#4aa8e8);color:#06222a;border-radius:26px 26px 26px 4px}
.s-glass{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);color:var(--tx)}
.s-hand{background:#2b2d52;color:#ffe3ef;border-radius:10px}.s-hand q{font-family:Caveat,cursive;font-size:27px}
.s-pap{background:#ffd9e6;color:#3b1226;border-radius:16px 4px 16px 4px}
.skel{height:150px;border-radius:18px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,6,20,.66);display:grid;place-items:center;padding:14px;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.md{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:22px;animation:up .25s}
@keyframes up{from{transform:translateY(16px);opacity:0}}
textarea,input[type=text],input[type=search],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:46px}
textarea{min-height:130px;resize:vertical}label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
.err{color:var(--pink);font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;translate:-50% 0;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:90;animation:up .25s}
.rx{display:flex;gap:6px;flex-wrap:wrap}.rx button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;min-height:38px}
.rx button.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 22%,transparent)}
.cm{border-left:3px solid var(--vio);padding:6px 0 6px 12px;margin:10px 0}.tag{font-size:12px;color:var(--teal)}
.chat{display:flex;flex-direction:column;gap:8px;min-height:240px}.b{max-width:80%;padding:9px 14px;border-radius:18px;animation:up .2s}
.b.me{align-self:flex-end;background:var(--vio);color:var(--on)}.b.th{background:var(--card);border:1px solid var(--line)}
.msgs{display:grid;grid-template-columns:280px 1fr;gap:14px}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--vio),var(--pink))}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal i{aspect-ratio:1;border-radius:8px;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:13px}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:700}
footer{border-top:1px solid var(--line);padding:30px 18px 100px;color:var(--mut);text-align:center}
.sr{position:absolute;left:-9999px}
@media(max-width:820px){nav.d{display:none}nav.m{display:flex}.hero{grid-template-columns:1fr;min-height:0}.msgs{grid-template-columns:1fr}.wall{grid-template-columns:1fr;gap:20px}.st{animation:none;min-height:0}.dsk{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><button class="logo" onclick="go('home')" aria-label="Unsaid home"><i></i>Unsaid</button>
<nav class="d" id="nd" aria-label="Main"></nav><span style="flex:1" class="dsk2"></span>
<button class="btn g sm" onclick="help()">Get help now</button>
<button class="ib" onclick="notif()" aria-label="Notifications">🔔<span class="dot"></span></button>
<button class="ib" onclick="theme()" aria-label="Toggle light or dark theme">◐</button></header>
<main id="app" tabindex="-1"></main>
<nav class="m" id="nm" aria-label="Mobile"></nav>
<footer>Unsaid is peer support, not professional care. If you’re in danger, contact local emergency services. <button class="btn g sm" onclick="help()">Get help now</button><p>© Unsaid · <a href="#" onclick="go('admin');return false">Moderation &amp; admin</a> · Privacy · Community rules</p></footer>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const MOODS={Sad:"😔",Anxious:"😰",Heartbroken:"💔",Angry:"😡",Lonely:"😞",Exhausted:"😴",Numb:"😶",Confused:"😕",Scared:"😨","Need someone":"🫂",Healing:"🌱",Hopeful:"😊",Grateful:"❤️",Motivated:"🔥",Happy:"✨"};
const RX=["🫂 I’m here","❤️ Sending love","💙 I understand","🌱 Keep going","🙏 Thinking of you","✨ You’ve got this"];
const T=[["Anonymous","Some days I wake up already exhausted. I don’t know why.","Exhausted","Family"],["LostButTrying","I thought I would have everything figured out by 25. I clearly don’t.","Confused","Life"],["Brian","Today wasn’t perfect, but I survived a really difficult week and I’m proud of myself.","Hopeful","Personal growth"],["Anonymous","I’m tired of pretending I’m okay.","Numb","Mental wellbeing"],["Anonymous","I just need someone to listen.","Need someone","Friendship"],["Wanjiru","I feel like everyone is moving forward except me.","Lonely","Life"],["Anonymous","I miss the person I used to be.","Sad","Mental wellbeing"],["Kip","Exam week is eating me alive. I can’t switch my brain off.","Anxious","School"],["Anonymous","I don’t want advice. I just want someone to hear me.","Need someone","Relationships"],["Amani","I finally had a good day. I almost forgot how that feels.","Happy","Personal growth"],["Anonymous","I’m scared about my future and money.","Scared","Money"],["Moonlit","I’m healing slowly. Some mornings it’s just getting out of bed.","Healing","Mental wellbeing"],["Anonymous","Two years since we broke up. I still reach for my phone to tell you things.","Heartbroken","Relationships"],["Zuri","My family doesn’t understand my career choice and it hurts.","Sad","Family"],["Anonymous","Grateful for the stranger who replied last night. You don’t know what it meant.","Grateful","Faith"],["Otieno","Started running again. Small steps, but they’re mine.","Motivated","Personal growth"],["Anonymous","I lost my grandmother in March and I’m still not okay.","Sad","Family"],["Anonymous","Everyone thinks I have it together. Inside I’m so tired.","Exhausted","Career"]];
const CLS=["note","pol","round","torn","bub","glass","hand","pap"];
const POSTS=T.map((t,i)=>({id:i,who:t[0],text:t[1],mood:t[2],topic:t[3],cls:CLS[i%8],age:[12,34,58,3,90,7,22,41][i%8]+"m",care:3+i*3%30,re:i*5%11,saved:false}));
const ADV=["I’ve felt exactly like this. You’re not behind. Your journey just doesn’t look like everyone else’s.","Take one day at a time. You don’t have to solve your whole life tonight.","You’re definitely not alone.","Maybe tell one person you trust, even in a single sentence.","Rest counts as progress too."];
const HEAR=["You don’t have to be okay to deserve rest.","Your feelings are valid, even the confusing ones.","Asking for help is a strength.","Small steps still move you forward.","Someone out there is glad you’re here."];
let st={page:"home",seed:1,filter:null,theme:null,saved:[],journal:[{d:"Oct 14",m:"Anxious",t:"Presentation tomorrow. Heart racing all evening.",tag:"school"},{d:"Oct 16",m:"Healing",t:"Walked home instead of taking the bus. Felt lighter.",tag:"self"},{d:"Oct 19",m:"Hopeful",t:"Talked to a friend. It wasn’t as scary as I thought.",tag:"friends"}],reqs:[{n:"Amani",s:"pending"},{n:"Daniel",s:"pending",a:1}],chat:[["th","Hi, thanks for replying to my post. 🫂"],["me","Of course. I’m here. Take your time."]]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=n=>{st.seed=(st.seed*16807+n*13)%2147483647;return st.seed/2147483647};
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)}
function theme(){const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=cur=="dark"?"light":"dark"}
const NAV=[["home","Home","🏠"],["discover","Discover","🧭"],["community","Community","🫶"],["messages","Messages","💬"],["journal","Journal","📓"],["journey","My Journey","🌱"],["profile","Profile","🙂"]];
const MNAV=[["home","Home","🏠"],["discover","Discover","🧭"],["share","Share","＋"],["messages","Messages","💬"],["profile","Profile","🙂"]];
function go(p){if(p=="share")return share();st.page=p;scrollTo(0,0);render()}
function render(){
$("#nd").innerHTML=NAV.map(n=>`<button onclick="go('${n[0]}')" ${st.page==n[0]?'aria-current="page"':""}>${n[1]}</button>`).join("");
$("#nm").innerHTML=MNAV.map(n=>`<button onclick="go('${n[0]}')" ${n[0]=="share"?'class="sh" aria-label="Share how I feel"':""} ${st.page==n[0]?'aria-current="page"':""}><span aria-hidden="true">${n[2]}</span>${n[0]=="share"?"":n[1]}</button>`).join("");
app.innerHTML=({home,discover,community,messages,journal,journey,profile,admin})[st.page]();
if(st.page=="home"){skel()}}
function skel(){const w=$("#wall");if(!w)return;w.innerHTML='<div class="skel"></div>'.repeat(4);setTimeout(()=>wall(),450)}
function sticker(p,i){const h=130+Math.floor(rnd(i+p.id)*70),r=(rnd(i+1)*6-3).toFixed(1);
return `<button class="st s-${p.cls}" style="--r:${r}deg;--d:${(3+rnd(i+7)*3).toFixed(1)}s;--h:${h}px" onclick="thread('${p.id}')" aria-label="Open thread: ${esc(p.text)}"><span class="m">${MOODS[p.mood]} ${p.mood.toUpperCase()}</span><q>${p.cw?"⚠️ Content warning. Open to read.":esc(p.text)}</q><span class="f"><span>${esc(p.who)} · ${p.age}</span><span>💙 ${p.care} 💬 ${p.re}</span></span></button>`}
const WM={Loneliness:[['Lonely'],['Friendship']],Anxiety:[['Anxious','Scared'],[]],Heartbreak:[['Heartbroken'],['Relationships']],Grief:[['Sad'],['Family']],'School stress':[['Anxious'],['School']],Family:[[],['Family']],Money:[['Scared'],['Money']],'Uncertain future':[['Confused','Scared'],['Life','Career']]};
function pick(n){let l=POSTS.filter(p=>!st.filter||p.mood==st.filter);const w=st.filter?[]:st.set.why;const bias=p=>{if(!w.length)return 0;let b=0;w.forEach(k=>{const m=WM[k];if(m&&(m[0].includes(p.mood)||m[1].includes(p.topic)))b=.35});if(['Hopeful','Healing','Happy','Grateful'].includes(p.mood))b=Math.max(b,.15);return b};return l.map(p=>[rnd(p.id+st.seed)-bias(p),p]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1])}
function pickOld(n){let l=POSTS.filter(p=>!st.filter||p.mood==st.filter);return l.map(p=>[rnd(p.id+st.seed),p]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1])}
function wall(){const w=$("#wall");if(!w)return;const l=pick(12);w.innerHTML=l.length?l.map(sticker).join(""):'<p class="lead">No stickers for this feeling yet. Be the first to share.</p>'}
function reshuffle(){st.seed=Date.now()%99991+1;wall()}
function home(){const m=pick(1)[0]||POSTS[0];const hr=new Date().getHours(),late=hr>=22||hr<5;return `${late?'<div class="card" role="note"><b>It’s late.</b> If tonight feels heavy, you’re welcome here. <button class="btn g sm" onclick="help()">Get help now</button></div>':''}
<section class="hero"><div><h1>Sometimes you don’t need answers.<br>You just need someone to listen.</h1>
<p class="lead">Share what you’re carrying. Stay anonymous or be known. Find people who understand, encouragement when you need it, and a safe space to breathe.</p>
<div class="row"><button class="btn" onclick="share()">Share How I Feel</button><button class="btn g" onclick="document.getElementById('wallh').scrollIntoView({behavior:'smooth'})">Read Someone’s Story</button><button class="btn g" onclick="checkin()">Quick check-in</button></div>
<p class="tag">Someone out there understands.</p></div>
<div class="card"><h3>Someone’s feeling today…</h3><div class="wall" style="grid-template-columns:1fr;padding:6px">${sticker(m,3)}</div><p>Have you ever felt this way?</p><div class="row"><button class="btn sm" onclick="toast('Thank you. Your “I’ve been there” was sent.')">I’ve been there</button><button class="btn g sm" onclick="thread('${m.id}',1)">I’d like to help</button><button class="btn g sm" onclick="thread('${m.id}')">Read more</button></div></div></section>
<h2 id="wallh">The wall of feelings</h2><p class="lead">Show me people feeling…</p>
<div class="row" role="group" aria-label="Mood filters">${["Lonely","Anxious","Heartbroken","Confused","Hopeful"].map(k=>`<button class="chip" aria-pressed="${st.filter==k}" onclick="st.filter=st.filter=='${k}'?null:'${k}';render();document.getElementById('wallh').scrollIntoView()">${MOODS[k]} ${k}</button>`).join("")}<button class="btn g sm" onclick="reshuffle()">Shuffle ↻</button></div>
${st.set.why.length&&!st.filter?'<p class="tag">Your wall leans toward '+st.set.why.join(', ').toLowerCase()+', with hopeful stories mixed in. <a href="#" onclick="st.set.why=[];render();return false">Show everything</a></p>':''}<div class="wall" id="wall" aria-live="polite"></div>
<div class="card" style="text-align:center"><p class="tag">One thing someone needs to hear today</p><p style="font:700 30px Caveat,cursive;margin:.2em">“${HEAR[st.seed%5]}”</p></div>
<h2>How it works</h2><div class="grid">${[["Share","Write what you’re carrying, anonymously or as yourself."],["Be heard","Real people reply with support, not scores."],["Connect","Ask to talk privately. Either of you can say no, always."],["Breathe","Keep a private journal and see how you’re doing over time."]].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="lead" style="font-size:16px">${x[1]}</p></div>`).join("")}</div>
<h2>Built to keep you safe</h2><div class="grid"><div class="card"><h3>Gentle moderation</h3><p>AI-assisted checks plus trained humans review reports. Harassment, hate and exploitation are removed.</p></div><div class="card"><h3>Crisis care</h3><p>If words suggest danger, we offer real help calmly. Never shame.</p></div><div class="card"><h3>Protections for minors</h3><p>Under-18s can’t receive private requests from unknown adults.</p></div><div class="card"><h3>Your identity stays yours</h3><p>Anonymous means anonymous. Emails are never shown.</p></div></div>
<h2>Questions</h2>${[["Is Unsaid therapy?","No. It’s peer support. For professional or emergency help, use Get help now."],["Can people see who I am?","Not unless you choose to show your name. Posts can be anonymous."],["Are there likes or followers?","No follower counts or rankings. Only supportive reactions."],["Can I leave a conversation?","Anytime. Block, mute, report or delete."]].map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")}
<div class="card" style="text-align:center;margin-top:30px"><h2 style="margin-top:0">Your turn</h2><p class="lead" style="margin:auto">What are you carrying today?</p><p><button class="btn" onclick="share()">Share How I Feel</button></p></div>`}
function discover(){const cats=["❤️ Relationships","🎓 School","💼 Career","🏠 Family","💰 Money","🧠 Mental wellbeing","👥 Friendship","🌍 Life","🙏 Faith","🌱 Personal growth"];
const q=st.q||"";const res=POSTS.filter(p=>!q||(p.text+p.topic+p.mood).toLowerCase().includes(q.toLowerCase()));
return `<h1 style="font-size:42px">Discover</h1><label for="q" class="sr">Search stories</label><input id="q" type="search" placeholder="Search: “I feel lonely”, “exam stress”, “heartbreak”…" value="${esc(q)}" oninput="st.q=this.value;clearTimeout(st.t);st.t=setTimeout(()=>{render();$('#q').focus();$('#q').setSelectionRange(99,99)},250)">
<div class="row" style="margin:14px 0">${cats.map(c=>`<button class="chip" onclick="st.q='${c.split(" ").slice(1).join(" ").split(" ")[0]}';render()">${c}</button>`).join("")}</div>

const o=modal('<div id="ob"></div><p><button class="btn" id="nx">Continue</button> <button class="btn g" id="sk">Skip for now</button></p>');
const chips=(L,k)=>`<div class="row">${L.map(x=>`<button class="chip" aria-pressed="${st.set[k].includes(x)}" data-v="${x}" data-k="${k}">${x}</button>`).join('')}</div>`;
const S=[()=>'<h2>Welcome. You don’t have to pretend here.</h2><p class="lead">Take a breath. Nothing here is a performance.</p><p>Before we begin, which describes you?</p><div class="row" role="group" aria-label="Age group"><button class="chip" aria-pressed="'+(st.set.minor===true)+'" data-age="1">Under 18</button><button class="chip" aria-pressed="'+(st.set.minor===false)+'" data-age="0">18 or older</button></div><p class="tag">Under 18 gets extra protections. We use this only to keep you safe.</p>',()=>'<h2>How would you like to participate?</h2>'+chips(M,'mode'),()=>'<h2>What brings you here?</h2><p>Pick as many as you like.</p>'+chips(W,'why'),()=>'<h2>Choose your privacy settings.</h2><p>You can change these anytime in Profile.</p>'+P.map(p=>`<label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input type="checkbox" data-p="${p[0]}" ${st.set[p[0]]?'checked':''} ${st.set.minor&&p[0]=='reqs'?'disabled':''} style="width:22px;height:22px"> ${p[1]}</label>`).join('')];
const d=()=>{o.querySelector('#ob').innerHTML=S[i]();o.querySelector('#nx').textContent=i==3?'Save and finish':'Continue'};d();
o.querySelector('#ob').onclick=e=>{const g=e.target.closest('[data-age]');if(g){st.set.minor=g.dataset.age=='1';if(st.set.minor)st.set.reqs=false;d();return}const b=e.target.closest('[data-v]');if(!b)return;const a=st.set[b.dataset.k],v=b.dataset.v;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);d()};
o.querySelector('#ob').onchange=e=>{if(e.target.dataset.p)st.set[e.target.dataset.p]=e.target.checked};
o.querySelector('#sk').onclick=()=>{o.remove();try{localStorage.setItem('unsaid_onboarded','1')}catch(e){}};
o.querySelector('#nx').onclick=()=>{if(i==0&&st.set.minor===undefined){toast('Choose an age group to continue');return}i++;if(i>3){o.remove();toast('Privacy settings saved');try{localStorage.setItem('unsaid_onboarded','1')}catch(e){}window.onboardDone&&window.onboardDone();render()}else d()}}
function onboardOld(){const s=["<h2>Welcome. You don’t have to pretend here.</h2>","<h2>How would you like to participate?</h2><p>Share anonymously · Share publicly · Listen · Give advice · Make connections</p>","<h2>What brings you here?</h2><p>Pick as many as you like.</p>","<h2>Choose your privacy settings.</h2><p>Anonymous by default. You can change this anytime.</p>"];let i=0;const o=modal(`<div id="ob"></div><p><button class="btn" id="nx">Continue</button></p>`);const d=()=>{o.querySelector("#ob").innerHTML=s[i]};d();o.querySelector("#nx").onclick=()=>{i++;if(i>=s.length){o.remove();toast("You’re all set")}else d()}}
render();setTimeout(()=>{try{if(localStorage.getItem('unsaid_onboarded'))return}catch(e){}onboard()},700);setInterval(()=>{if(st.page=="home"&&!document.querySelector(".ov")&&!matchMedia("(prefers-reduced-motion:reduce)").matches&&document.visibilityState=="visible"&&!document.activeElement.classList.contains("st")&&$("#wall")&&$("#wall").children.length>1&&!$("#wall").querySelector(".skel"))reshuffle()},45000);
</script><script src="/api.js"></script><script src="/api2.js"></script></body></html>
